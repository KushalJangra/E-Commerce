services:
  base:
    image: "ecommerce/ecommerce-base:latest"
    build:
      context: .
      dockerfile: docker/base.dockerfile
    profiles:
      - build-only

  zookeeper:
    restart: always
    container_name: kafka-like-zookeeper
    image: zookeeper:3.8
    ports:
      - "21850:2181"
    volumes:
      - "zookeeper-volume:/data"
      - "zookeeper-volume:/datalog"
    environment:
      - ZOO_MY_ID=1
      - ZOO_SERVERS=server.1=zookeeper:2888:3888;2181

  kafka:
    container_name: kafka
    hostname: kafka
    image: docker.io/apache/kafka:4.1.1
    depends_on:
      - zookeeper
    volumes:
      - "kafka-volume:/var/lib/kafka/data"
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CLIENT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_LISTENERS=CLIENT://:9092,EXTERNAL://:9093
      - KAFKA_ADVERTISED_LISTENERS=CLIENT://kafka:9092,EXTERNAL://localhost:9093
      - KAFKA_INTER_BROKER_LISTENER_NAME=CLIENT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    restart: unless-stopped

  account_db:
    container_name: "account_db"
    image: postgres:14.0
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: 123456
    volumes:
      - account_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  product_db:
    container_name: "product_db"
    image: docker.elastic.co/elasticsearch/elasticsearch-oss:6.2.4
    environment:
      ES_JAVA_OPTS: -Xms1g -Xmx1g
      discovery.type: single-node
    volumes:
      - product_db_data:/usr/share/elasticsearch/data

  order_db:
    container_name: "order_db"
    image: postgres:14.0
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: 123456
    volumes:
      - order_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  payment_db:
    container_name: "payment_db"
    image: postgres:14.0
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: 123456
    volumes:
      - payment_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  account:
    container_name: "account"
    image: "ecommerce/account:latest"
    build:
      context: .
      dockerfile: docker/services/account.dockerfile
    depends_on:
      - account_db
    environment:
      DATABASE_URL: postgres://ecommerce:123456@account_db/ecommerce?sslmode=disable
      SECRET_KEY: dev-secret-key
      ISSUER: ecommerce-api
    restart: on-failure

  product:
    container_name: "product"
    image: "ecommerce/product:latest"
    build:
      context: .
      dockerfile: docker/services/product.dockerfile
    depends_on:
      - product_db
      - kafka
    environment:
      DATABASE_URL: http://product_db:9200
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    restart: on-failure

  order:
    container_name: "order"
    image: "ecommerce/order:latest"
    build:
      context: .
      dockerfile: docker/services/order.dockerfile
    depends_on:
      - order_db
      - account
      - product
    environment:
      DATABASE_URL: postgres://ecommerce:123456@order_db/ecommerce?sslmode=disable
      ACCOUNT_SERVICE_URL: account:8080
      PRODUCT_SERVICE_URL: product:8080
    restart: on-failure

  payment:
    container_name: "payment"
    image: "ecommerce/payment:latest"
    build:
      context: .
      dockerfile: docker/services/payment.dockerfile
    depends_on:
      - payment_db
      - order
      - kafka
    environment:
      DATABASE_URL: postgres://ecommerce:123456@payment_db/ecommerce?sslmode=disable
      ORDER_SERVICE_URL: order:8080
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PRODUCT_EVENTS_TOPIC: product_events
      # Add Payment Provider Credentials
    restart: on-failure

  gateway:
    container_name: "gateway"
    image: "ecommerce/gateway:latest"
    build:
      context: .
      dockerfile: docker/services/gateway.dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - account
      - product
      - order
      - payment
    environment:
      ACCOUNT_SERVICE_URL: account:8080
      PRODUCT_SERVICE_URL: product:8080
      ORDER_SERVICE_URL: order:8080
      PAYMENT_SERVICE_URL: payment:8080
      SECRET_KEY: dev-secret-key
      ISSUER: ecommerce-api
    restart: on-failure

volumes:
  account_db_data:
  product_db_data:
  order_db_data:
  payment_db_data:
  kafka-volume:
  zookeeper-volume: